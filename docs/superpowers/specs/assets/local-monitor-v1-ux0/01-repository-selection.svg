<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="768" viewBox="0 0 1366 768"><foreignObject width="1366" height="768"><div xmlns="http://www.w3.org/1999/xhtml" style="width:1366px;height:768px"><style>
:root{
  --bg:#0b1017;--panel:#111823;--panel2:#151e2a;--panel3:#0f1620;--line:#263244;
  --text:#e8edf5;--muted:#91a0b5;--dim:#657389;--accent:#67a7ff;--accent2:#8a7cf6;
  --green:#58d68d;--orange:#f2aa4c;--red:#ff6b72;--purple:#b58be2;--cyan:#66d5d2;
  --shadow:0 12px 30px rgba(0,0,0,.24);
}
*{box-sizing:border-box} html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:13px}
body{letter-spacing:.01em}.app{height:100vh;display:flex;flex-direction:column;background:radial-gradient(circle at 82% -10%,rgba(76,112,166,.13),transparent 30%),var(--bg)}
.header{height:56px;display:flex;align-items:center;border-bottom:1px solid var(--line);background:rgba(13,19,28,.96);padding:0 22px;gap:18px;flex:0 0 auto}
.brand{font-weight:700;font-size:15px;white-space:nowrap}.crumbs{display:flex;align-items:center;gap:8px;color:var(--muted);min-width:0;flex:1}.crumbs span{white-space:nowrap}.crumbs .current{color:var(--text);overflow:hidden;text-overflow:ellipsis}.sep{color:#4d5c71}.header-actions{display:flex;align-items:center;gap:8px}.status,.button,.ghost,.iconbtn,.chip,.seg{border:1px solid var(--line);background:#121a25;color:var(--text);border-radius:7px;height:32px;padding:0 12px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}.status{background:#111b18}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(88,214,141,.12)}.button.primary{background:#1d5fab;border-color:#2c76ca}.button.subtle{background:#162236}.ghost{background:transparent}.iconbtn{width:32px;padding:0;justify-content:center}.main{flex:1;min-height:0;padding:20px 26px 22px;display:flex;flex-direction:column;gap:14px}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.title{font-size:23px;font-weight:700;margin:0 0 6px}.subtitle{color:var(--muted);line-height:1.6}.actions{display:flex;gap:8px;align-items:center}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.select,.search,.field{height:34px;border:1px solid var(--line);border-radius:7px;background:#101721;color:var(--text);display:flex;align-items:center;padding:0 11px;gap:8px}.search{flex:1;min-width:260px}.search .placeholder{color:var(--dim)}.card{background:linear-gradient(180deg,#151e2a,#111923);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:"Cascadia Mono","Consolas",monospace}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;border:1px solid var(--line);font-size:11px;background:#111925;color:var(--muted)}.badge.green{color:#8fe6b2;border-color:#295844;background:#10241a}.badge.red{color:#ff9aa0;border-color:#63323a;background:#281317}.badge.orange{color:#f6c278;border-color:#634d2d;background:#281f12}.badge.blue{color:#91c1ff;border-color:#294c74;background:#102033}.divider{height:1px;background:var(--line)}
.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:#8190a5;font-weight:500;font-size:11px;padding:8px 10px;border-bottom:1px solid var(--line)}.table td{padding:10px;border-bottom:1px solid #202b3a;vertical-align:middle}.table tr:last-child td{border-bottom:0}.table tbody tr:hover{background:#151e2a}.row-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px}.row-sub{font-size:11px;color:var(--muted);margin-top:4px;display:flex;gap:8px}.activity{display:flex;gap:5px;flex-wrap:wrap}.token{font-variant-numeric:tabular-nums;font-weight:650}.token-sub{font-size:10px;color:var(--muted);margin-top:3px}.empty-note{border:1px dashed #34445b;border-radius:10px;background:#101822;padding:14px;color:var(--muted)}
.bar{height:10px;border-radius:999px;overflow:hidden;background:#0c1219;display:flex;border:1px solid #263346}.bar>span{height:100%}.seg-input{background:#6ea6ff}.seg-output{background:#aa83df}.seg-cache{background:#d39534}.seg-new{background:#4d83c7}.seg-create{background:#66d5d2}.metric-grid{display:grid;grid-template-columns:1.25fr 1.25fr .7fr .7fr .7fr .85fr;gap:8px}.metric{padding:10px 11px;min-width:0}.metric h4{margin:0 0 7px;color:#aab7ca;font-size:11px;font-weight:500}.metric .big{font-size:18px;font-weight:750;margin-bottom:7px}.metric .foot{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:6px;gap:8px}.metric.simple .big{font-size:16px}.metric.simple .foot{display:block}.metric .warning{color:#f2c274;font-size:10px;margin-top:6px}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px;min-height:0;flex:1}.pane{min-height:0;overflow:hidden}.pane-head{height:42px;padding:0 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-weight:650}.pane-body{height:calc(100% - 42px);overflow:auto}.inspector{padding:14px}.section{padding:13px 0;border-bottom:1px solid #243044}.section:last-child{border-bottom:0}.section h3{margin:0 0 9px;font-size:12px;color:#c2ccda}.meta{display:grid;grid-template-columns:100px 1fr;gap:7px 10px;color:var(--muted)}.meta strong{color:var(--text);font-weight:550}.code{background:#0b1119;border:1px solid #223047;border-radius:7px;padding:10px;line-height:1.5;color:#d8e1ee;font-family:"Cascadia Mono","Consolas",monospace;font-size:11px;white-space:pre-wrap}.link{color:#7eb7ff}.danger{color:var(--red)}.success{color:var(--green)}
.timeline{padding:8px 10px 12px}.scale{display:grid;grid-template-columns:270px 1fr 54px;color:#64758d;font-size:10px;padding:4px 0 8px}.ticks{display:flex;justify-content:space-between}.run{margin-bottom:8px;border:1px solid #283548;border-radius:8px;overflow:hidden;background:#101721}.run-head{height:34px;display:grid;grid-template-columns:270px 1fr 54px;align-items:center;background:#141d28;padding:0 8px;font-weight:650}.node{height:29px;display:grid;grid-template-columns:270px 1fr 54px;align-items:center;padding:0 8px;border-top:1px solid #1e2938}.node:hover,.node.selected{background:#172335}.tree{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.indent1{padding-left:20px}.indent2{padding-left:42px}.track{height:100%;position:relative;border-left:1px solid #1b2635;border-right:1px solid #1b2635;background:repeating-linear-gradient(to right,transparent 0,transparent calc(20% - 1px),#1b2635 calc(20% - 1px),#1b2635 20%)}.tbar{position:absolute;height:7px;top:11px;border-radius:5px;background:#607da8}.tbar.tool{background:#d09234}.tbar.skill{background:#6ea6ff}.tbar.sub{background:#b58be2}.tbar.error{background:#db5b61}.tbar.retry{background:#55c985}.dur{text-align:right;color:#9ca9bb;font-variant-numeric:tabular-nums;font-size:11px}
.modal-backdrop{position:absolute;inset:56px 0 0;background:rgba(3,7,12,.68);display:flex;align-items:center;justify-content:center;padding:22px}.modal{width:960px;height:640px;border:1px solid #35445b;border-radius:12px;background:#111923;box-shadow:0 30px 80px rgba(0,0,0,.55);overflow:hidden}.modal-head{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 17px;font-size:16px;font-weight:700}.modal-grid{height:calc(100% - 52px);display:grid;grid-template-columns:190px 1fr}.settings-nav{border-right:1px solid var(--line);padding:10px}.settings-nav .item{height:38px;border-radius:7px;padding:0 10px;display:flex;align-items:center;color:#a5b1c2;margin-bottom:3px}.settings-nav .item.active{background:#1a2a40;color:#eaf2ff;border:1px solid #29476b}.settings-body{padding:18px;overflow:auto}.settings-body h2{margin:0 0 5px;font-size:19px}.settings-body>p{margin:0 0 16px;color:var(--muted)}.settings-card{padding:14px;margin-bottom:10px}.settings-row{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.settings-row h3{margin:0 0 5px;font-size:13px}.settings-row p{margin:0;color:var(--muted);line-height:1.5}.settings-actions{display:flex;gap:7px;margin-top:12px}
.review-label{position:absolute;top:8px;left:8px;background:#20334e;border:1px solid #3b5e8a;color:#cfe3ff;border-radius:6px;padding:5px 8px;font-size:10px;z-index:10}
</style><div class="app"><div class="header"><div class="brand">Local Monitor</div><div class="crumbs"><span class="current">Repository</span></div><div class="header-actions"><div class="status"><span class="dot"></span>受信中</div><div class="button">⚙ 設定</div></div></div><main class="main" style="max-width:1180px;width:100%;margin:0 auto">
<div class="pagehead"><div><h1 class="title">Repositoryを選択</h1><div class="subtitle">AI coding-agentのSessionを確認するRepositoryを選択します。</div></div><div class="actions"><div class="ghost">すべてのSession</div><div class="button primary">＋ Repositoryを追加</div></div></div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:6px">
  <div class="card" style="padding:18px;min-height:145px;border-color:#3d6fae;position:relative"><div style="display:flex;justify-content:space-between"><div><div style="font-size:17px;font-weight:700">local-agent-monitor</div><div class="muted small" style="margin-top:5px">GitHub Copilot OTel観測基盤</div></div><div class="iconbtn">⋯</div></div><div style="display:flex;gap:28px;margin-top:25px"><div><div class="muted small">Session</div><div style="font-size:22px;font-weight:750;margin-top:4px">87</div></div><div><div class="muted small">最終観測</div><div style="font-size:15px;font-weight:650;margin-top:7px">2分前</div></div></div><div style="position:absolute;right:16px;bottom:15px;color:#82b7ff">開く →</div></div>
  <div class="card" style="padding:18px;min-height:145px;position:relative"><div style="display:flex;justify-content:space-between"><div><div style="font-size:17px;font-weight:700">misc</div><div class="muted small" style="margin-top:5px">研究資料・実験</div></div><div class="iconbtn">⋯</div></div><div style="display:flex;gap:28px;margin-top:25px"><div><div class="muted small">Session</div><div style="font-size:22px;font-weight:750;margin-top:4px">14</div></div><div><div class="muted small">最終観測</div><div style="font-size:15px;font-weight:650;margin-top:7px">昨日</div></div></div><div style="position:absolute;right:16px;bottom:15px;color:#82b7ff">開く →</div></div>
  <div class="card" style="padding:18px;min-height:145px;position:relative"><div style="display:flex;justify-content:space-between"><div><div style="font-size:17px;font-weight:700">github-copilot-otel-lab</div><div class="muted small" style="margin-top:5px">検証用Mirror</div></div><div class="iconbtn">⋯</div></div><div style="display:flex;gap:28px;margin-top:25px"><div><div class="muted small">Session</div><div style="font-size:22px;font-weight:750;margin-top:4px">5</div></div><div><div class="muted small">最終観測</div><div style="font-size:15px;font-weight:650;margin-top:7px">3日前</div></div></div><div style="position:absolute;right:16px;bottom:15px;color:#82b7ff">開く →</div></div>
</div>
<div class="card" style="padding:16px 18px;display:flex;align-items:center;justify-content:space-between;margin-top:4px"><div><div style="font-weight:700;font-size:15px">Repository未割り当て</div><div class="muted small" style="margin-top:5px">Repository情報を確認できないSessionがあります。必要に応じて手動で割り当てられます。</div></div><div style="display:flex;align-items:center;gap:18px"><div><span style="font-size:20px;font-weight:750">4</span> <span class="muted">Session</span></div><div class="button subtle">確認する</div></div></div>
<div style="margin-top:auto;display:flex;justify-content:flex-end"><div class="ghost">アーカイブ済みRepository 2件</div></div>
</main></div></div></foreignObject></svg>