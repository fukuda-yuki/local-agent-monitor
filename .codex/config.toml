#:schema https://developers.openai.com/codex/config-schema.json

# <repository>/.codex/config.toml
# trusted repository only

# Top-level settings precede table declarations.
approval_policy = "never"
sandbox_mode = "danger-full-access"

model_verbosity = "low"
model_reasoning_summary = "concise"

# Availability only; delegation policy is in docs/agent-guides/repository-workflow.md.
# No repository concurrency/depth override; other config layers and runtime defaults apply.
[features]
multi_agent = true

[features.context_management]
experimental_mode = true