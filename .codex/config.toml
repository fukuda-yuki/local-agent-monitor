#:schema https://developers.openai.com/codex/config-schema.json

# <repository>/.codex/config.toml
# trusted repository only

# トップレベル設定は、最初のテーブル宣言より前に置く
approval_policy = "never"
sandbox_mode = "danger-full-access"

model_verbosity = "low"
model_reasoning_summary = "concise"

[agents]
max_depth = 2

# 公開設定側のスレッド上限も合わせる
max_threads = 24

[features]
multi_agent = true

model_provider = "Model_Studio_Token_Plan_Personal"
model = "qwen3.8-max-preview"
model_reasoning_effort = "xhigh"
model_catalog_json = ".codex/model-catalog.local.json"

[model_providers.Model_Studio_Token_Plan_Personal]
name = "Model_Studio_Token_Plan_Personal"
base_url = "https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1"
env_key = "OPENAI_API_KEY"
wire_api = "responses"